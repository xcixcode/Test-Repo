<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>온라인 오목</title>
<style>
:root{--bg:#f4ead5;--fg:#2b2118;--card:#fffaf0;--bd:#d9c7a0;--ac:#b8742a;--acfg:#fff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1713;--fg:#f1e6d2;--card:#2a231c;--bd:#4a3d2e;--ac:#e0a050;--acfg:#1b1713;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1b1713;--fg:#f1e6d2;--card:#2a231c;--bd:#4a3d2e;--ac:#e0a050;--acfg:#1b1713;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
.w{max-width:600px;margin:0 auto;padding:12px}
h1{font-size:22px;text-align:center;margin:8px 0 14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
button{font:inherit;font-weight:600;border:0;border-radius:12px;padding:13px 14px;background:var(--ac);color:var(--acfg);width:100%;margin-top:8px}
button.s{background:transparent;color:var(--fg);border:1px solid var(--bd)}
button:disabled{opacity:.4}
input{width:100%;font:700 32px monospace;letter-spacing:.4em;text-align:center;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--fg);padding:12px;margin-top:8px}
.code{font:800 48px monospace;letter-spacing:.3em;text-align:center;margin:10px 0;color:var(--ac)}
p{margin:4px 0;font-size:14px;line-height:1.5}
.hide{display:none}
#st{text-align:center;font-weight:700;padding:10px;font-size:16px}
canvas{display:block;margin:0 auto;border-radius:10px;touch-action:none;max-width:100%}
.row{display:flex;gap:8px}
</style></head><body><div class="w">
<h1>⚫ 온라인 오목 ⚪</h1>

<div id="lobby">
 <div class="card"><p><b>1대1 온라인 대전</b></p>
 <p>방을 만들면 4자리 코드가 나옵니다. 친구가 코드를 입력하면 바로 연결돼요.</p>
 <button id="bHost">방 만들기 (흑·선공)</button>
 <button id="bJoin" class="s">방 참가하기 (백)</button>
 <button id="bLocal" class="s">한 기기에서 둘이 두기</button></div>

 <div id="pHost" class="card hide">
  <p style="text-align:center">친구에게 이 코드를 알려주세요</p>
  <div class="code" id="rc">----</div>
  <p id="hs" style="text-align:center">상대를 기다리는 중…</p>
  <button id="hBack" class="s">취소</button></div>

 <div id="pJoin" class="card hide">
  <p style="text-align:center">방장에게 받은 4자리 코드를 입력하세요</p>
  <input id="ji" inputmode="numeric" maxlength="4" placeholder="0000" autocomplete="off">
  <button id="jGo">입장하기</button>
  <button id="jBack" class="s">취소</button></div>
 <p id="msg" style="text-align:center;color:#c0392b"></p>
</div>

<div id="game" class="hide">
 <div id="st"></div>
 <canvas id="cv"></canvas>
 <div class="row"><button id="bPlace" disabled>여기에 두기</button></div>
 <div class="row"><button id="bRe" class="s">다시하기</button><button id="bExit" class="s">나가기</button></div>
</div>
</div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const N=15,$=id=>document.getElementById(id);
const PREFIX='omok-v1-';
let b,turn,my,mode,over,last,sel,win,peer,conn,names={1:'흑',2:'백'};
const cv=$('cv'),cx=cv.getContext('2d');
let S,M;
function size(){S=Math.min(innerWidth-24,560);const r=devicePixelRatio||1;cv.style.width=cv.style.height=S+'px';cv.width=cv.height=S*r;cx.setTransform(r,0,0,r,0,0);M=S/(N+1);draw()}
addEventListener('resize',size);

function reset(){b=Array.from({length:N},()=>Array(N).fill(0));turn=1;over=false;last=null;sel=null;win=null;$('bPlace').disabled=true;status();draw()}
function status(){
 let t;
 if(over){t=win?(mode==='local'?names[win.c]+' 승리! 🎉':(win.c===my?'🎉 승리했습니다!':'😢 패배했습니다')):'무승부'}
 else if(mode==='local')t=names[turn]+'돌 차례';
 else t=(turn===my?'내 차례':'상대 차례')+' ('+(my===1?'흑':'백')+')';
 $('st').textContent=t}

function draw(){
 if(!S)return;
 cx.fillStyle='#dcb35c';cx.fillRect(0,0,S,S);
 cx.strokeStyle='#6b4f1d';cx.lineWidth=1;cx.beginPath();
 for(let i=0;i<N;i++){const p=M*(i+1);cx.moveTo(M,p);cx.lineTo(M*N,p);cx.moveTo(p,M);cx.lineTo(p,M*N)}
 cx.stroke();cx.fillStyle='#6b4f1d';
 for(const[x,y]of[[3,3],[11,3],[3,11],[11,11],[7,7]]){cx.beginPath();cx.arc(M*(x+1),M*(y+1),3,0,7);cx.fill()}
 if(!b)return;
 const r=M*.43;
 for(let y=0;y<N;y++)for(let x=0;x<N;x++){const c=b[y][x];if(!c)continue;
  const px=M*(x+1),py=M*(y+1);
  const g=cx.createRadialGradient(px-r*.3,py-r*.3,r*.1,px,py,r);
  if(c===1){g.addColorStop(0,'#666');g.addColorStop(1,'#000')}else{g.addColorStop(0,'#fff');g.addColorStop(1,'#cfcfcf')}
  cx.fillStyle=g;cx.beginPath();cx.arc(px,py,r,0,7);cx.fill();
  if(c===2){cx.strokeStyle='#999';cx.stroke()}}
 if(last){cx.fillStyle='#e53935';cx.beginPath();cx.arc(M*(last[0]+1),M*(last[1]+1),r*.2,0,7);cx.fill()}
 if(sel){const px=M*(sel.x+1),py=M*(sel.y+1);cx.strokeStyle='#e53935';cx.lineWidth=2.5;
  cx.strokeRect(px-r,py-r,r*2,r*2);
  cx.globalAlpha=.5;cx.fillStyle=(mode==='local'?turn:my)===1?'#000':'#fff';cx.beginPath();cx.arc(px,py,r,0,7);cx.fill();cx.globalAlpha=1;cx.lineWidth=1}
 if(win){cx.strokeStyle='#e53935';cx.lineWidth=3;for(const[x,y]of win.cells){cx.beginPath();cx.arc(M*(x+1),M*(y+1),r+2,0,7);cx.stroke()}cx.lineWidth=1}
}

cv.addEventListener('pointerdown',e=>{
 if(over||(mode!=='local'&&turn!==my))return;
 const R=cv.getBoundingClientRect(),x=Math.round((e.clientX-R.left)/R.width*S/M)-1,y=Math.round((e.clientY-R.top)/R.height*S/M)-1;
 if(x<0||y<0||x>=N||y>=N||b[y][x])return;
 sel={x,y};$('bPlace').disabled=false;draw();
 if(navigator.vibrate)navigator.vibrate(10)});
$('bPlace').onclick=()=>{if(!sel)return;place(sel.x,sel.y,false)};

function place(x,y,remote){
 if(over||b[y][x])return;
 const c=turn;b[y][x]=c;last=[x,y];sel=null;$('bPlace').disabled=true;
 if(!remote&&conn&&conn.open)conn.send({t:'m',x,y});
 const w=check(x,y,c);
 if(w){over=true;win={c,cells:w}}
 else if(b.every(r=>r.every(v=>v)))over=true;
 else turn=3-c;
 status();draw()}

function check(x,y,c){
 for(const[dx,dy]of[[1,0],[0,1],[1,1],[1,-1]]){
  const cells=[[x,y]];
  for(const s of[1,-1]){let i=x+dx*s,j=y+dy*s;
   while(i>=0&&j>=0&&i<N&&j<N&&b[j][i]===c){cells.push([i,j]);i+=dx*s;j+=dy*s}}
  if(cells.length>=5)return cells}
 return null}

function startGame(){
 $('lobby').classList.add('hide');$('game').classList.remove('hide');
 size();reset()}

$('bRe').onclick=()=>{
 if(mode==='local'){reset();return}
 if(conn&&conn.open){conn.send({t:'r'});my=3-my;reset()}};
$('bExit').onclick=()=>{try{conn&&conn.close();peer&&peer.destroy()}catch(e){}location.reload()};
$('bLocal').onclick=()=>{mode='local';my=0;startGame()};

/* ---- PeerJS: 4자리 방 코드 ---- */
const msg=t=>$('msg').textContent=t||'';
function show(id){for(const p of['pHost','pJoin'])$(p).classList.toggle('hide',p!==id);msg()}
function leave(){try{conn&&conn.close();peer&&peer.destroy()}catch(e){}peer=conn=null;show(null)}

function wire(c){
 conn=c;
 c.on('data',d=>{
  if(d.t==='m')place(d.x,d.y,true);
  else if(d.t==='r'){my=3-my;reset()}});
 c.on('close',()=>{if(mode==='net'){$('st').textContent='상대와 연결이 끊어졌습니다';over=true;$('bPlace').disabled=true}});
 const go=()=>{mode='net';startGame()};
 c.open?go():c.on('open',go)}

function openRoom(tries){
 const code=String(Math.floor(Math.random()*10000)).padStart(4,'0');
 $('rc').textContent=code;$('hs').textContent='상대를 기다리는 중…';
 peer=new Peer(PREFIX+code);
 peer.on('open',()=>{});
 peer.on('connection',c=>{
  if(conn){c.close();return}
  my=1;wire(c)});
 peer.on('error',e=>{
  if(e.type==='unavailable-id'&&tries<5){peer.destroy();openRoom(tries+1)}
  else $('hs').textContent='서버 연결 실패: '+e.type});
 peer.on('disconnected',()=>{try{peer.reconnect()}catch(e){}})}

$('bHost').onclick=()=>{show('pHost');openRoom(0)};
$('hBack').onclick=leave;
$('bJoin').onclick=()=>{show('pJoin');$('ji').value='';$('ji').focus()};
$('jBack').onclick=leave;
$('ji').oninput=e=>e.target.value=e.target.value.replace(/\D/g,'').slice(0,4);
$('jGo').onclick=()=>{
 const code=$('ji').value;
 if(code.length!==4){msg('4자리 숫자를 입력하세요');return}
 msg('연결 중…');$('jGo').disabled=true;
 const fail=t=>{msg(t);$('jGo').disabled=false;try{peer&&peer.destroy()}catch(e){}};
 peer=new Peer();
 const timer=setTimeout(()=>fail('연결 시간이 초과되었습니다'),15000);
 peer.on('open',()=>{
  const c=peer.connect(PREFIX+code,{reliable:true});
  c.on('open',()=>{clearTimeout(timer);my=2;wire(c)});
  c.on('error',()=>{clearTimeout(timer);fail('연결에 실패했습니다')})});
 peer.on('error',e=>{clearTimeout(timer);fail(e.type==='peer-unavailable'?'해당 코드의 방이 없습니다':'오류: '+e.type)})};
</script></body></html>
