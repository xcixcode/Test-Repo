<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>함께보기 - 실시간 유튜브 싱크</title>
<meta name="description" content="친구들과 유튜브 영상을 실시간으로 싱크 맞춰 함께 보세요.">
<meta property="og:title" content="함께보기 - 실시간 유튜브 싱크">
<meta property="og:description" content="방 코드만 공유하면 바로 같이 볼 수 있어요.">
<meta name="theme-color" content="#0f1115">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E▶️%3C/text%3E%3C/svg%3E">
<style>
:root{--ease:cubic-bezier(.2,.8,.2,1);color-scheme:dark}
:root[data-theme=dark]{color-scheme:dark;--bg:#0b0d12;--card:#151922;--line:#262c3a;--txt:#eef0f6;--sub:#8e97ab;--field:#0f121a;--pri:#ff5a5f;--pri2:#ff8a4c;--ok:#34d399;--warn:#fbbf24;--shadow:0 12px 32px rgba(0,0,0,.45);--glass:rgba(11,13,18,.72)}
:root[data-theme=light]{color-scheme:light;--bg:#f5f6fa;--card:#ffffff;--line:#e3e6ef;--txt:#161a24;--sub:#667085;--field:#f6f7fb;--pri:#f43f5e;--pri2:#fb7a3c;--ok:#10b981;--warn:#d97706;--shadow:0 12px 32px rgba(30,41,80,.10);--glass:rgba(245,246,250,.78)}
*{box-sizing:border-box}
html{scrollbar-width:thin;scrollbar-color:var(--line) transparent}
body{margin:0;min-height:100vh;color:var(--txt);font-family:-apple-system,"Pretendard","Noto Sans KR",system-ui,sans-serif;
  background:radial-gradient(900px 420px at 8% -8%,color-mix(in srgb,var(--pri) 15%,transparent),transparent),
             radial-gradient(700px 380px at 100% 0%,color-mix(in srgb,var(--pri2) 10%,transparent),transparent),var(--bg);
  background-attachment:fixed;transition:background-color .25s,color .25s}
header{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 20px;
  background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{display:grid;place-items:center;width:32px;height:32px;border-radius:10px;color:#fff;font-size:14px;background:linear-gradient(135deg,var(--pri),var(--pri2));box-shadow:0 6px 16px color-mix(in srgb,var(--pri) 40%,transparent)}
header h1{font-size:18px;margin:0;letter-spacing:-.02em}
header small{color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{display:grid;place-items:center;width:38px;height:38px;padding:0;border-radius:12px;background:var(--card);color:var(--txt);border:1px solid var(--line);box-shadow:none}
.icon-btn:hover{border-color:var(--pri)}
.icon-btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
:root[data-theme=dark] .moon,:root[data-theme=light] .sun{display:none}
.wrap{max-width:1200px;margin:0 auto;padding:20px 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:var(--shadow);transition:background-color .25s,border-color .25s}
input,button{font:inherit;border-radius:12px;border:1px solid var(--line);padding:11px 14px;transition:all .2s var(--ease)}
input{width:100%;background:var(--field);color:var(--txt);outline:none}
input::placeholder{color:var(--sub)}
input:focus{border-color:var(--pri);box-shadow:0 0 0 3px color-mix(in srgb,var(--pri) 22%,transparent)}
button{cursor:pointer;color:#fff;font-weight:600;white-space:nowrap;border-color:transparent;background:linear-gradient(135deg,var(--pri),var(--pri2));box-shadow:0 6px 16px color-mix(in srgb,var(--pri) 30%,transparent)}
button:hover{filter:brightness(1.06);transform:translateY(-1px)}
button:active{transform:scale(.97)}
button.ghost{background:var(--field);color:var(--txt);border-color:var(--line);box-shadow:none}
button.ghost:hover{border-color:var(--pri);filter:none}
[hidden]{display:none!important}
#lobby{max-width:460px;margin:48px auto;display:grid;gap:14px;padding:26px}
#lobby h2{margin:0 0 4px;font-size:24px;letter-spacing:-.02em}
#lobby p{margin:0;color:var(--sub);font-size:14px;line-height:1.5}
.row{display:flex;gap:8px}
.divider{display:flex;align-items:center;gap:12px;color:var(--sub);font-size:13px}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
#room{display:grid;grid-template-columns:1fr 350px;gap:18px}
.video{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:20px;overflow:hidden;box-shadow:var(--shadow);border:1px solid var(--line)}
.video iframe,.video #player{position:absolute;inset:0;width:100%;height:100%}
.bar{display:flex;gap:8px;margin-top:14px}
.info{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:14px;font-size:14px;color:var(--sub)}
.pill{display:inline-flex;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 14px}
.pill b{color:var(--txt);margin-left:5px;letter-spacing:.04em}
.info button{padding:8px 14px;font-size:14px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:8px;box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 25%,transparent)}
.dot.off{background:var(--warn);box-shadow:0 0 0 3px color-mix(in srgb,var(--warn) 25%,transparent)}
.chat{display:flex;flex-direction:column;height:calc(100vh - 120px);min-height:380px;padding:16px}
#log{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding-right:4px;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.msg{font-size:14px;line-height:1.5;word-break:break-word;background:var(--field);border:1px solid var(--line);border-radius:14px;padding:8px 12px;animation:pop .25s var(--ease)}
.msg b{color:var(--pri);margin-right:8px}
.msg.sys{background:none;border:none;color:var(--sub);font-size:13px;text-align:center;padding:2px}
.chat .row{margin-top:12px}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,10px);background:var(--card);color:var(--txt);border:1px solid var(--line);box-shadow:var(--shadow);padding:11px 18px;border-radius:999px;font-size:14px;opacity:0;transition:all .3s var(--ease);pointer-events:none;z-index:20}
#toast.on{opacity:1;transform:translate(-50%,0)}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media(max-width:860px){#room{grid-template-columns:1fr}.chat{height:400px}header small{display:none}.wrap{padding:14px 12px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<script>
// 첫 렌더 전에 테마 적용 (깜빡임 방지): 저장된 값 → 시스템 설정 순
(function(){var t;try{t=localStorage.getItem('theme')}catch(e){}
if(t!=='dark'&&t!=='light')t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';
document.documentElement.dataset.theme=t})();
</script>
</head>
<body>
<header>
  <div class="brand"><span class="logo">▶</span><h1>함께보기</h1><small>친구들과 유튜브 실시간 싱크</small></div>
  <button id="themeBtn" class="icon-btn" aria-label="다크/라이트 모드 전환" title="다크/라이트 모드 전환">
    <svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <svg class="moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
  </button>
</header>

<div class="wrap">
  <!-- 로비 -->
  <section id="lobby" class="card">
    <div><h2>같이 볼까요?</h2><p>방을 만들고 코드를 공유하면 모두의 재생·일시정지·이동이 동기화돼요.</p></div>
    <input id="name" placeholder="닉네임" maxlength="12">
    <button id="btnCreate">새 방 만들기</button>
    <div class="divider">또는</div>
    <div class="row">
      <input id="code" placeholder="방 코드 (6자리)" maxlength="6" style="text-transform:uppercase">
      <button id="btnJoin" class="ghost">참가</button>
    </div>
    <p id="lobbyMsg" style="color:var(--warn)"></p>
  </section>

  <!-- 방 -->
  <section id="room" hidden>
    <div>
      <div class="video"><div id="player"></div></div>
      <div class="bar">
        <input id="url" placeholder="유튜브 링크 또는 영상 ID를 붙여넣기">
        <button id="btnLoad">불러오기</button>
      </div>
      <div class="info">
        <span class="pill"><span class="dot" id="dot"></span><span id="status">연결 중…</span></span>
        <span class="pill">방 코드 <b id="roomCode">------</b></span>
        <span class="pill">👥 <b id="count">1</b>명</span>
        <button class="ghost" id="btnCopy">초대 링크 복사</button>
        <button class="ghost" id="btnSync">싱크 맞추기</button>
      </div>
    </div>
    <aside class="card chat">
      <div id="log"></div>
      <div class="row">
        <input id="chatIn" placeholder="메시지 입력…" maxlength="200">
        <button id="btnSend">전송</button>
      </div>
    </aside>
  </section>
</div>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const PREFIX = 'ytsync-';
// PeerJS 기본 설정(STUN/TURN 포함)을 그대로 사용합니다.
// 회사/학교망 등에서 연결이 안 되면 TURN 서버를 직접 추가하세요. (기본 설정을 덮어쓰므로 STUN도 함께 적어야 해요)
// const PEER_OPTS = {config:{iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'turn:서버주소:3478',username:'...',credential:'...'}]}};
const PEER_OPTS = {};
// 시그널링 서버 연결이 일시적으로 끊기면 자동 재연결 (기존 P2P 연결은 유지됨)
function keepAlive(p){
  p.on('disconnected',()=>{if(p.destroyed)return;setStatus('서버 재연결 중…',false);setTimeout(()=>{try{p.reconnect()}catch(e){}},1000)});
}
let peer, isHost = false, conns = [], hostConn = null;
let player, ready = false, remote = false, remoteTimer;
let myName = '', room = '', curVid = '', lastT = 0, lastTick = 0;

/* ---------- 유틸 ---------- */
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2200)}
function addLog(text,name){
  const d=document.createElement('div');d.className='msg'+(name?'':' sys');
  if(name){const b=document.createElement('b');b.textContent=name;d.appendChild(b)}
  d.appendChild(document.createTextNode(text));
  $('log').appendChild(d);$('log').scrollTop=1e9;
}
function setStatus(t,ok=true){$('status').textContent=t;$('dot').classList.toggle('off',!ok)}
function parseVid(u){
  u=u.trim();
  if(/^[\w-]{11}$/.test(u))return u;
  const m=u.match(/(?:v=|youtu\.be\/|embed\/|shorts\/|live\/)([\w-]{11})/);
  return m?m[1]:null;
}
function genCode(){const c='ABCDEFGHJKMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<6;i++)s+=c[Math.random()*c.length|0];return s}
function applyRemote(fn){
  remote=true;clearTimeout(remoteTimer);
  try{fn()}catch(e){console.warn(e)}
  remoteTimer=setTimeout(()=>{remote=false;lastT=player.getCurrentTime();lastTick=Date.now()},900);
}

let wantPlay=false;
// 모바일 사파리 등에서 자동재생이 막혔을 때 안내
function checkAutoplay(){
  clearTimeout(checkAutoplay.t);
  checkAutoplay.t=setTimeout(()=>{
    if(!wantPlay||!ready)return;
    const st=player.getPlayerState();
    if(st!==1&&st!==3)toast('브라우저가 자동재생을 막았어요. 영상의 ▶ 버튼을 눌러 주세요');
  },2000);
}

/* ---------- 유튜브 플레이어 ---------- */
const ytReady=new Promise(res=>{
  if(window.YT&&YT.Player)res();else window.onYouTubeIframeAPIReady=res;
});
(()=>{const s=document.createElement('script');s.src='https://www.youtube.com/iframe_api';document.head.appendChild(s)})();
setTimeout(()=>{if(!(window.YT&&YT.Player))$('lobbyMsg').textContent='YouTube 플레이어를 불러오지 못했어요. 광고 차단 확장 프로그램이나 네트워크를 확인해 주세요.'},8000);

async function makePlayer(){
  await ytReady;
  const vars={playsinline:1,rel:0};
  if(location.protocol.startsWith('http'))vars.origin=location.origin;
  return new Promise(res=>{
    player=new YT.Player('player',{
      width:'100%',height:'100%',playerVars:vars,
      events:{
        onReady:()=>{ready=true;res()},
        onStateChange:onState,
        onPlaybackRateChange:e=>{if(!remote)send({type:'rate',r:e.data})}
      }
    });
  });
}
function loadVideo(vid,t=0,play=true){
  curVid=vid;
  const o={videoId:vid,startSeconds:t};
  play?player.loadVideoById(o):player.cueVideoById(o);
}
function onState(e){
  if(remote)return;
  const t=player.getCurrentTime();
  if(e.data===YT.PlayerState.PLAYING)send({type:'play',t});
  else if(e.data===YT.PlayerState.PAUSED)send({type:'pause',t});
}
// 사용자가 진행바를 직접 옮긴 경우 감지
setInterval(()=>{
  if(!ready||remote||!curVid)return;
  const now=Date.now(),cur=player.getCurrentTime();
  const playing=player.getPlayerState()===YT.PlayerState.PLAYING;
  const expect=lastT+(playing?((now-lastTick)/1000)*player.getPlaybackRate():0);
  if(lastTick&&Math.abs(cur-expect)>1.5)send({type:'seek',t:cur,playing});
  lastT=cur;lastTick=now;
},500);

/* ---------- 네트워크 (PeerJS: 호스트 중계형) ---------- */
function send(m,except){
  m.from=m.from||myName; // 중계되는 메시지는 원래 보낸 사람 이름 유지
  if(isHost)conns.forEach(c=>{if(c!==except&&c.open)c.send(m)});
  else if(hostConn&&hostConn.open)hostConn.send(m);
}
function syncMsg(){
  return{type:'sync',vid:curVid,t:player.getCurrentTime(),playing:player.getPlayerState()===YT.PlayerState.PLAYING,r:player.getPlaybackRate()};
}
function updateCount(n){$('count').textContent=n}
function broadcastCount(){const n=conns.length+1;updateCount(n);send({type:'count',n})}

function handle(m,from){
  // 외부에서 온 데이터는 검증 (잘못된 값/과도한 길이 차단)
  if(!m||typeof m.type!=='string')return;
  if(m.t!==undefined&&!Number.isFinite(m.t))return;
  if((m.type==='load'||m.type==='sync')&&!/^[\w-]{11}$/.test(m.vid||''))return;
  if(m.from!==undefined)m.from=String(m.from).slice(0,12);
  if(m.name!==undefined)m.name=String(m.name).slice(0,12);
  if(m.text!==undefined)m.text=String(m.text).slice(0,200);
  const relay=['load','play','pause','seek','rate','chat'];
  if(isHost&&relay.includes(m.type))send(m,from);
  switch(m.type){
    case 'hello':
      from.pname=m.name;
      addLog(`${m.name}님이 입장했어요`);
      if(curVid)from.send(syncMsg());
      broadcastCount();
      send({type:'chat',sys:1,text:`${m.name}님이 입장했어요`},from);
      break;
    case 'req': if(isHost&&curVid)from.send(syncMsg());break;
    case 'count': updateCount(m.n);break;
    case 'chat': m.sys?addLog(m.text):addLog(m.text,m.from);break;
    case 'load': wantPlay=true;checkAutoplay();applyRemote(()=>loadVideo(m.vid,0,true));toast(`${m.from}님이 영상을 바꿨어요`);break;
    case 'play': wantPlay=true;checkAutoplay();applyRemote(()=>{if(Math.abs(player.getCurrentTime()-m.t)>0.7)player.seekTo(m.t,true);player.playVideo()});break;
    case 'pause': wantPlay=false;applyRemote(()=>{player.pauseVideo();player.seekTo(m.t,true)});break;
    case 'seek': wantPlay=!!m.playing;if(wantPlay)checkAutoplay();applyRemote(()=>{player.seekTo(m.t,true);m.playing?player.playVideo():player.pauseVideo()});break;
    case 'rate': applyRemote(()=>player.setPlaybackRate(m.r));break;
    case 'sync': doSync(m);break;
  }
}
function doSync(m){
  wantPlay=!!m.playing;
  const st=player.getPlayerState();
  const same=m.vid===curVid;
  const stateDiff=m.playing?(st!==1&&st!==3):(st===1);
  const need=!same||Math.abs(player.getCurrentTime()-m.t)>1.5||stateDiff||(m.r&&player.getPlaybackRate()!==m.r);
  if(!need)return; // 평소엔 건드리지 않음 → 내 조작이 무시되지 않아요
  applyRemote(()=>{
    if(!same){loadVideo(m.vid,m.t,m.playing)}
    else{
      if(Math.abs(player.getCurrentTime()-m.t)>1.5)player.seekTo(m.t,true);
      if(m.playing&&st!==1&&st!==3)player.playVideo();
      if(!m.playing&&st===1)player.pauseVideo();
    }
    if(m.r&&player.getPlaybackRate()!==m.r)player.setPlaybackRate(m.r);
  });
  if(m.playing)checkAutoplay();
}

function showRoom(){
  if(!$('room').hidden){setStatus(isHost?'호스트 · 대기 중':'연결됨');return}
  $('lobby').hidden=true;$('room').hidden=false;$('roomCode').textContent=room;
  addLog(`방 ${room}에 입장했어요. 코드를 친구에게 공유하세요!`);
}

let busy=false;
// 로비 단계의 오류는 로비에 표시하고 재시도할 수 있게 초기화
function fail(msg){
  if($('room').hidden){
    $('lobbyMsg').textContent=msg;busy=false;hostConn=null;
    if(peer&&!peer.destroyed)peer.destroy();
    peer=null;
  }else setStatus(msg,false);
}
async function ensurePlayer(){if(!ready)await makePlayer()}

async function createRoom(){
  if(busy)return;busy=true;
  myName=$('name').value.trim()||'호스트';
  isHost=true;room=genCode();
  $('lobbyMsg').textContent='방을 만드는 중…';
  await ensurePlayer();
  startHost();
}
function startHost(){
  peer=new Peer(PREFIX+room,PEER_OPTS);keepAlive(peer);
  peer.on('open',()=>{
    $('lobbyMsg').textContent='';showRoom();setStatus('호스트 · 대기 중');
    // 호스트 주기 싱크 (드리프트 보정)
    if(!window._hb)window._hb=setInterval(()=>{if(curVid&&conns.length)send(syncMsg())},3000);
  });
  peer.on('connection',c=>{
    c.on('open',()=>{conns.push(c)});
    c.on('data',m=>handle(m,c));
    c.on('close',()=>{
      conns=conns.filter(x=>x!==c);
      addLog(`${c.pname||'참가자'}님이 나갔어요`);broadcastCount();
    });
  });
  peer.on('error',e=>{
    if(e.type==='unavailable-id'){peer.destroy();room=genCode();startHost()} // 코드 충돌 시 새 코드로 재시도
    else fail('연결 오류: '+e.type);
  });
}

async function joinRoom(code){
  if(busy)return;
  code=code.trim().toUpperCase();
  if(code.length!==6){$('lobbyMsg').textContent='방 코드는 6자리예요.';return}
  busy=true;
  myName=$('name').value.trim()||'게스트'+(Math.random()*90+10|0);
  isHost=false;room=code;
  $('lobbyMsg').textContent='연결 중…';
  await ensurePlayer();
  peer=new Peer(undefined,PEER_OPTS);keepAlive(peer);
  peer.on('open',()=>{
    if(hostConn)return; // 서버 재연결 시 중복 접속 방지
    hostConn=peer.connect(PREFIX+room,{reliable:true});
    hostConn.on('open',()=>{
      $('lobbyMsg').textContent='';showRoom();setStatus('연결됨');
      hostConn.send({type:'hello',name:myName});
    });
    hostConn.on('data',m=>handle(m,hostConn));
    hostConn.on('close',()=>{setStatus('호스트와 연결이 끊겼어요',false);addLog('호스트와 연결이 끊겼어요. 새로고침 후 다시 입장해 주세요.')});
    setTimeout(()=>{if($('room').hidden&&busy)fail('연결 시간이 초과됐어요. 네트워크를 확인하고 다시 시도해 주세요.')},12000);
  });
  peer.on('error',e=>{
    if(e.type==='peer-unavailable')fail('방을 찾을 수 없어요. 코드를 확인해 주세요.');
    else fail('연결 오류: '+e.type);
  });
}

/* ---------- UI 이벤트 ---------- */
$('btnCreate').onclick=createRoom;
$('btnJoin').onclick=()=>joinRoom($('code').value);
$('code').addEventListener('keydown',e=>{if(e.key==='Enter')joinRoom($('code').value)});
$('btnLoad').onclick=()=>{
  const v=parseVid($('url').value);
  if(!v){toast('올바른 유튜브 링크가 아니에요');return}
  loadVideo(v,0,true);send({type:'load',vid:v});$('url').value='';
};
$('url').addEventListener('keydown',e=>{if(e.key==='Enter')$('btnLoad').click()});
$('btnSync').onclick=()=>{
  if(isHost){if(curVid){send(syncMsg());toast('모두의 화면을 내 기준으로 맞췄어요')}}
  else{send({type:'req'});toast('호스트 기준으로 맞추는 중…')}
};
$('btnCopy').onclick=async()=>{
  const link=location.origin+location.pathname+'?room='+room;
  try{await navigator.clipboard.writeText(link);toast('초대 링크를 복사했어요')}
  catch{prompt('아래 링크를 복사하세요',link)}
};
function sendChat(){
  const t=$('chatIn').value.trim();if(!t)return;
  addLog(t,myName);send({type:'chat',text:t});$('chatIn').value='';
}
$('btnSend').onclick=sendChat;
$('chatIn').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing)sendChat()});

// file:// 로 직접 열면 유튜브 임베드가 막히므로 안내 (GitHub Pages 등 https 배포에서는 정상)
if(location.protocol==='file:')$('lobbyMsg').textContent='⚠ 파일을 직접 열면 영상이 재생되지 않아요. GitHub Pages 주소로 접속해 주세요.';
// 초대 링크로 들어오면 코드 자동 입력
const q=new URLSearchParams(location.search).get('room');
if(q)$('code').value=q.toUpperCase().slice(0,6);

/* ---------- 다크/라이트 모드 토글 ---------- */
function applyTheme(t,save){
  document.documentElement.dataset.theme=t;
  const m=document.querySelector('meta[name=theme-color]');
  if(m)m.content=t==='dark'?'#0b0d12':'#f5f6fa';
  if(save){try{localStorage.setItem('theme',t)}catch(e){}}
}
$('themeBtn').onclick=()=>applyTheme(document.documentElement.dataset.theme==='dark'?'light':'dark',true);
applyTheme(document.documentElement.dataset.theme);
</script>
